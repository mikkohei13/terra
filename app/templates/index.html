{% extends "base.html" %}
{% block title %}Terra{% endblock %}

{% block content %}
<section>
    <h1>Terra</h1>

    {% if logged_in %}
        <p>Signed in as {{ person_name }}.</p>
    {% elif show_token_form %}
        <p>Local login. Paste a FinBIF person token.</p>
        <form method="post" action="{{ url_for('login') }}" class="stack-form">
            <label for="personToken">Person token</label>
            <input
                id="personToken"
                name="personToken"
                type="password"
                autocomplete="off"
                required
            >
            <button type="submit">Log in</button>
        </form>
    {% else %}
        <p><a class="button" href="{{ havistin_url }}">Log in via Havistin</a></p>
    {% endif %}
</section>
{% endblock %}
