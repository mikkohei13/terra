services:
  web:
    build: ./
    image: terra:latest
    volumes:
      - ./app:/terra/app
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=TRUE
    entrypoint: >
      gunicorn
      --chdir /terra/app main:app -w 1
      --threads 1 -b 0.0.0.0:80
      --timeout 120
      --reload
      --reload-extra-file /terra/app/templates/base.html
      --reload-extra-file /terra/app/templates/index.html
      --reload-extra-file /terra/app/templates/login.html
      --reload-extra-file /terra/app/templates/observe.html
      --reload-extra-file /terra/app/templates/result.html
