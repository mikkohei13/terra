services:
  web:
    build: ./
    image: terra:latest
    volumes:
      - ./app:/terra/app
    ports:
      - "127.0.0.1:85:85"
    env_file:
      - .env
      - .env.dev
    environment:
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=TRUE
      - SESSION_COOKIE_SECURE=0
      - DEV_LOGIN=1
    entrypoint: >
      gunicorn
      --chdir /terra/app main:app -w 1
      --threads 1 -b 0.0.0.0:85
      --timeout 120
      --reload
      --reload-extra-file /terra/app/templates/base.html
      --reload-extra-file /terra/app/templates/index.html
      --reload-extra-file /terra/app/templates/simple.html
